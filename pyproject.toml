[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-lab"
version = "0.1.0"
description = "基于真实市场数据的虚拟货币模拟交易与量化研究平台"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
  { name = "Crypto Lab contributors" },
]
dependencies = [
  "alembic>=1.14,<2",
  "pydantic>=2.12,<3",
  "psycopg[binary]>=3.2,<4",
  "python-socks[asyncio]>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

